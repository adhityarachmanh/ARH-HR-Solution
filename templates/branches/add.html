{% extends "layout_app.html" %}

{% block title %}Add Branch{% endblock title %}
{% block header_title %}Add New Branch{% endblock header_title %}

{% block content %}
<div class="w-full max-w-lg bg-white p-8 rounded-xl shadow-lg border border-gray-100">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">Branch Details</h2>

    {% if error %}
    <div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-4" role="alert">
        <p class="font-bold">Error</p>
        <p>{{ error }}</p>
    </div>
    {% endif %}

    <form action="/branches/add" method="post" class="space-y-6">
        <div>
            <label for="name" class="block text-sm font-medium text-gray-700">Branch Name</label>
            <input id="name" name="name" type="text" required
                class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3">
        </div>

        <div>
            <label for="company_name" class="block text-sm font-medium text-gray-700">Company Name (Required by
                DB)</label>
            <input id="company_name" name="company_name" type="text" required
                class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3">
        </div>

        <div>
            <label for="comp_id" class="block text-sm font-medium text-gray-700">Company (Link)</label>
            <select id="comp_id" name="comp_id"
                class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                <option value="">-- Pilih Company (Optional) --</option>
                {% for company in companies %}
                <option value="{{ company.comp_id }}">{{ company.comp_name | default(value="[Nama Kosong]") }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label for="timezone_id" class="block text-sm font-medium text-gray-700">Time Zone (Link)</label>
            <select id="timezone_id" name="timezone_id"
                class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                <option value="">-- Pilih Time Zone (Optional) --</option>
                {% for timezone in timezones %}
                <option value="{{ timezone.time_zone_id }}">{{ timezone.time_zone_name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="flex justify-end space-x-4 pt-4">
            <a href="/branches/list"
                class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-200 rounded-md hover:bg-gray-300 transition duration-150">
                Cancel
            </a>
            <button type="submit"
                class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150">
                Create Branch
            </button>
        </div>
    </form>
</div>
{% endblock content %}
