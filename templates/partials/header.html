<header class="flex items-center justify-between px-6 py-4 bg-white border-b border-gray-200">
    <div class="flex items-center">
        <h1 class="text-xl font-semibold text-gray-800">Admin Panel</h1>
    </div>

    <div class="flex items-center">
        <span class="text-gray-700 mr-4">Hi, **{{ username | default(value="Admin") }}**</span>
        
        <form action="/logout" method="post" class="inline">
            <button type="submit" class="px-3 py-2 text-sm font-medium text-white bg-red-600 rounded-md hover:bg-red-700 transition duration-150">
                Logout
            </button>
        </form>
    </div>
</header>
