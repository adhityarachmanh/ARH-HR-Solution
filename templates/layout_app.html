<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard{% endblock title %} | CMS Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .dropdown:hover .dropdown-menu {
            display: block;
        }
    </style>
</head>
<body class="bg-gray-100">
    
    {% include "partials/header.html" %}

    <main class="min-h-screen overflow-x-hidden overflow-y-auto bg-gray-100">
        <div class="container mx-auto px-6 py-8">
            <h3 class="text-gray-700 text-3xl font-medium">{% block header_title %}{% endblock header_title %}</h3>

            <div class="mt-4">
                {% block content %}{% endblock content %}
            </div>
        </div>
    </main>

</body>
</html>
