{% extends "layout_app.html" %}

{% block title %}Add PTKP Type{% endblock title %}
{% block header_title %}Add New PTKP Type{% endblock header_title %}

{% block content %}
<div class="flex justify-center">
    <div class="w-full max-w-lg bg-white p-8 rounded-xl shadow-lg border border-gray-100">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-3">PTKP Type Form</h2>

        {% if error %}
        <div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-4 rounded" role="alert">
            <p class="font-bold">Error</p>
            <p>{{ error }}</p>
        </div>
        {% endif %}

        <form action="/ptkp_types/add" method="post" class="space-y-6">
            
            <div>
                <label for="ptkp_code" class="block text-sm font-medium text-gray-700">PTKP Code <span class="text-red-500">*</span></label>
                <input id="ptkp_code" name="ptkp_code" type="text" required
                       value="{{ form_data.ptkp_code | default(value='') }}"
                       class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:ring-indigo-500 focus:border-indigo-500">
            </div>

            <div>
                <label for="ptkp_name" class="block text-sm font-medium text-gray-700">PTKP Type Name (Example: K/0) <span class="text-red-500">*</span></label>
                <input id="ptkp_name" name="ptkp_name" type="text" required
                       value="{{ form_data.ptkp_name | default(value='') }}"
                       class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            
            <div>
                <label for="ptkp_amount" class="block text-sm font-medium text-gray-700">PTKP Amount (IDR) <span class="text-red-500">*</span></label>
                <input id="ptkp_amount" name="ptkp_amount" type="number" step="0.01" required
                       value="{{ form_data.ptkp_amount | default(value='') }}"
                       class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:ring-indigo-500 focus:border-indigo-500">
            </div>

            <div class="flex justify-end space-x-4 pt-4 border-t mt-6">
                <a href="/ptkp_types/list"
                    class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-200 rounded-md hover:bg-gray-300 transition duration-150">
                    Cancel
                </a>
                <button type="submit"
                    class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150">
                    Save PTKP Type
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock content %}
