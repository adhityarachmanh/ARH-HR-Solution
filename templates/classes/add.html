{% extends "layout_app.html" %}

{% block title %}Add Class{% endblock title %}
{% block header_title %}Tambah Kelas Baru{% endblock header_title %}

{% block content %}
<div class="flex justify-center">
    <div class="w-full max-w-lg bg-white p-8 rounded-xl shadow-lg border border-gray-100">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-3">Informasi Kelas Baru</h2>

        {% if error %}
        <div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-4 rounded" role="alert">
            <p class="font-bold">Error</p>
            <p>{{ error }}</p>
        </div>
        {% endif %}

        <form action="/classes/add" method="post" class="space-y-6">
            
            <div>
                <label for="class_code" class="block text-sm font-medium text-gray-700">Kode Kelas <span class="text-red-500">*</span></label>
                <input id="class_code" name="class_code" type="text" required
                       value="{{ form_data.class_code | default(value='') }}"
                       class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:ring-indigo-500 focus:border-indigo-500">
            </div>

            <div>
                <label for="description" class="block text-sm font-medium text-gray-700">Deskripsi (Maks. 1000 Karakter)</label>
                <textarea id="description" name="description" rows="3"
                          class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:ring-indigo-500 focus:border-indigo-500">{{ form_data.description | default(value='') }}</textarea>
            </div>

            <div class="flex justify-end space-x-4 pt-4 border-t mt-6">
                <a href="/classes/list"
                    class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-200 rounded-md hover:bg-gray-300 transition duration-150">
                    Batal
                </a>
                <button type="submit"
                    class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150">
                    Simpan Kelas
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock content %}
