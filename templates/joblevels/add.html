{% extends "layout_app.html" %}

{% block title %}{{ title }}{% endblock title %}
{% block header_title %}{{ header_title }}{% endblock header_title %}

{% block content %}
<div class="flex justify-center">
    <div class="w-full max-w-md bg-white p-8 rounded-xl shadow-lg border border-gray-100">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Job Level Details</h2>

        {% if error %}
        <div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-4" role="alert">
            <p class="font-bold">Error</p>
            <p>{{ error }}</p>
        </div>
        {% endif %}

        <form action="/joblevels/add" method="post" class="space-y-6">

            <div>
                <label for="name" class="block text-sm font-medium text-gray-700">Level Name</label>
                <input id="name" name="name" type="text" required
                    class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            </div>

            <div>
                <label for="order" class="block text-sm font-medium text-gray-700">Level Order (Optional, e.g., 1, 2,
                    3)</label>
                <input id="order" name="order" type="number"
                    class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            </div>

            <div class="flex justify-end space-x-4 pt-4">
                <a href="/joblevels/list"
                    class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-200 rounded-md hover:bg-gray-300 transition duration-150">
                    Cancel
                </a>
                <button type="submit"
                    class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150">
                    Create Job Level
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock content %}
